name: Verify course and Java capstone
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for file in assets/*.js; do node --check "$file"; done
      - name: Java graph-search regression suite
        run: bash java-capstone/run-tests.sh
      - name: Student practice harness (TODOs are expected)
        run: bash practice/run-tests.sh
